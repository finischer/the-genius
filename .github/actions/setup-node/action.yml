name: 'Setup Node.js'
description: 'Extract Node.js version from package.json and setup Node.js with caching'
outputs:
  node-version:
    description: 'The detected Node.js version'
    value: ${{ steps.extract_node_version.outputs.NODE_VERSION }}
runs:
  using: 'composite'
  steps:
    - name: Extract Node.js version
      id: extract_node_version
      shell: bash
      run: |
        NODE_VERSION=$(jq -r '.engines.node' package.json)
        echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_OUTPUT
        echo "📦 Detected Node.js version: $NODE_VERSION"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.extract_node_version.outputs.NODE_VERSION }}
        cache: 'npm'
