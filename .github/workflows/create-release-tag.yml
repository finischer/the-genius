name: Create GitHub Release after Production Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "📦 Tag: $TAG_NAME (Version: $VERSION)"

      - name: Get commit messages since last tag
        id: changelog
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 $TAG^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "📝 No previous tag found, getting all commits"
            COMMITS=$(git log $TAG --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "📝 Getting commits between $PREV_TAG and $TAG"
            COMMITS=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Escape for GitHub Actions output
          COMMITS="${COMMITS//'%'/'%25'}"
          COMMITS="${COMMITS//$'\n'/'%0A'}"
          COMMITS="${COMMITS//$'\r'/'%0D'}"
          
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get_version.outputs.version }}';
            const tag = '${{ steps.get_version.outputs.tag }}';
            const commits = `${{ steps.changelog.outputs.commits }}`;
            
            const releaseNotes = `## Release ${tag}
            
            ### Changes
            ${commits || 'No changes documented'}
            
            ---
            *This release was automatically created after deploying to production.*
            
            **Deployment URL:** https://beta.the-genius.de/`;
            
            try {
              const response = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Release ${tag}`,
                body: releaseNotes,
                draft: false,
                prerelease: false
              });
              
              console.log(`✅ Release created: ${response.data.html_url}`);
            } catch (error) {
              if (error.status === 422) {
                console.log('ℹ️  Release already exists for this tag');
              } else {
                console.error('❌ Failed to create release:', error.message);
                throw error;
              }
            }
