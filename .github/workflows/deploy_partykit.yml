name: Deploy Party Server

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "GitHub environment holding the Cloudflare credentials"
        required: true
      workerName:
        type: string
        description: "Cloudflare Worker name (host becomes <name>.<subdomain>.workers.dev)"
        required: true

jobs:
  deploy:
    name: Deploy Party Server (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Deploy Worker
        run: bunx wrangler deploy --name ${{ inputs.workerName }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
