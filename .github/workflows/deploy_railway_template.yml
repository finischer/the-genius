name: Deploy Template

on:
  workflow_call:
    inputs:
      environmentName:
        description: The name of the environment to deploy to.
        required: true
        type: string
      url:
        description: The URL to deploy to.
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environmentName }}
      url: ${{ inputs.url }}
    steps:
      # - name: Download artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: ${{ inputs.artifactName }}
      #     path: ./buildArtifact

      # Steps to deploy the code go here.
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Extract Node.js version
        id: extract_node_version
        run: echo "NODE_VERSION=$(jq -r '.engines.node' package.json)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ steps.extract_node_version.outputs.NODE_VERSION }}

      # - name: Install dependencies
      #   run: npm ci

      # - name: Build
      #   run: npm run build

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Deploy to ${{ inputs.environmentName }}
        run: railway up --service the-genius --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
