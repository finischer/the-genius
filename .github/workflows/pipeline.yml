name: CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - staging
    types:
      - closed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 14

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Typechecking
        run: npm run typecheck

      - name: Building
        run: npm run build
