name: Publish

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Type of release"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  APP_ENV: "${{ secrets.APP_ENV }}"
  GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
  GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
  MONGODB_URI: "${{ secrets.MONGODB_URI }}"
  NEXTAUTH_SECRET: "${{ secrets.NEXTAUTH_SECRET }}"
  DISCORD_CLIENT_ID: "${{ secrets.DISCORD_CLIENT_ID }}"
  DISCORD_CLIENT_SECRET: "${{ secrets.DISCORD_CLIENT_SECRET }}"
  SOCKET_IO_ADMIN_USERNAME: "${{ secrets.SOCKET_IO_ADMIN_USERNAME }}"
  SOCKET_IO_ADMIN_PASSWORD: "${{ secrets.SOCKET_IO_ADMIN_PASSWORD }}"
  WEBSITE_URL: "${{ secrets.WEBSITE_URL }}"
  NEXT_PUBLIC_THE_GENIUS_ENV: "${{ secrets.NEXT_PUBLIC_THE_GENIUS_ENV }}"
  NEXT_PUBLIC_PARTYKIT_HOST: "${{ secrets.NEXT_PUBLIC_PARTYKIT_HOST }}"
  NEXT_PUBLIC_POSTHOG_KEY: "${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}"
  NEXT_PUBLIC_POSTHOG_HOST: "${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}"

jobs:
  staging:
    name: Deploy to staging
    environment:
      name: staging
      url: https://the-genius-staging.up.railway.app/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Extract Node.js version
        id: extract_node_version
        run: echo "::set-output name=NODE_VERSION::$(jq -r '.engines.node' package.json)"

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ steps.extract_node_version.outputs.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Deploy to staging
        run: railway up --service the-genius --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  production:
    if: github.event.inputs.releaseType == 'production'
    name: Deploy to production
    environment:
      name: production
      url: https://beta.the-genius.de/
    needs: [staging]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Extract Node.js version
        id: extract_node_version
        run: echo "::set-output name=NODE_VERSION::$(jq -r '.engines.node' package.json)"

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ steps.extract_node_version.outputs.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check package.json version
        id: check_version
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "Current version: $CURRENT_VERSION"
          git fetch --tags
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "Latest tag: $LATEST_TAG"
          if [ "$CURRENT_VERSION" == "$LATEST_TAG" ]; then
            echo "Version has not changed manually. Bumping version..."
            npm version patch --no-git-tag-version
            NEW_VERSION=$(jq -r '.version' package.json)
            echo "New version: $NEW_VERSION"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git commit -am "Bump version to $NEW_VERSION"
            git tag $NEW_VERSION
            git push origin --tags
            git push
          else
            echo "Version was changed manually."
          fi

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Deploy to production
        run: railway up --service the-genius --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_version.outputs.NEW_VERSION
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.check_version.outputs.NEW_VERSION }}
          release_name: Release ${{ steps.check_version.outputs.NEW_VERSION }}
          body: |
            Release ${{ steps.check_version.outputs.NEW_VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
