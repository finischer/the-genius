name: Publish

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Type of release"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  APP_ENV: "${{ secrets.APP_ENV }}"
  GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
  GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
  MONGODB_URI: "${{ secrets.MONGODB_URI }}"
  NEXTAUTH_SECRET: "${{ secrets.NEXTAUTH_SECRET }}"
  DISCORD_CLIENT_ID: "${{ secrets.DISCORD_CLIENT_ID }}"
  DISCORD_CLIENT_SECRET: "${{ secrets.DISCORD_CLIENT_SECRET }}"
  SOCKET_IO_ADMIN_USERNAME: "${{ secrets.SOCKET_IO_ADMIN_USERNAME }}"
  SOCKET_IO_ADMIN_PASSWORD: "${{ secrets.SOCKET_IO_ADMIN_PASSWORD }}"
  WEBSITE_URL: "${{ secrets.WEBSITE_URL }}"
  NEXT_PUBLIC_THE_GENIUS_ENV: "${{ secrets.NEXT_PUBLIC_THE_GENIUS_ENV }}"
  NEXT_PUBLIC_PARTYKIT_HOST: "${{ secrets.NEXT_PUBLIC_PARTYKIT_HOST }}"
  NEXT_PUBLIC_POSTHOG_KEY: "${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}"
  NEXT_PUBLIC_POSTHOG_HOST: "${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}"

jobs:
  staging:
    name: Deploy to staging
    environment:
      name: staging
      url: https://the-genius-staging.up.railway.app/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Extract Node.js version
        id: extract_node_version
        run: echo "::set-output name=NODE_VERSION::$(jq -r '.engines.node' package.json)"

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ steps.extract_node_version.outputs.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Deploy to staging
        run: railway up --service the-genius --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  production:
    if: github.event.inputs.releaseType == 'production'
    name: Deploy to production
    environment:
      name: production
      url: https://beta.the-genius.de/
    needs: [staging]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Extract Node.js version
        id: extract_node_version
        run: echo "::set-output name=NODE_VERSION::$(jq -r '.engines.node' package.json)"

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ steps.extract_node_version.outputs.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package.json version changed
        id: verify_version
        run: |
          set -e
          # Wenn kein Unterschied, dann abbrechen:
          if git diff --quiet HEAD -- package.json; then
            echo "ERROR: The package.json version was NOT updated. Please bump version manually before production deploy."
            exit 1
          fi

          # Lese neue Version aus package.json
          newVersion=$(jq -r '.version' package.json)
          echo "New version found in package.json: $newVersion"
          echo "::set-output name=VERSION::$newVersion"

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Deploy to production
        run: railway up --service the-genius --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Create Tag
        run: |
          newVersion=${{ steps.verify_version.outputs.VERSION }}
          echo "Tagging current commit as v${newVersion}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${newVersion}"

      - name: Get last tag
        id: last_tag
        run: |
          # Hole letzten Tag (oder Standard "v0.0.0", wenn es keinen gibt)
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $last_tag"
          echo "::set-output name=LAST_TAG::$last_tag"

      - name: Generate changelog
        id: changelog
        run: |
          # Hole neue Version aus vorherigem Schritt
          new_version=${{ steps.verify_version.outputs.VERSION }}
          last_tag=${{ steps.last_tag.outputs.LAST_TAG }}

          # Generiere Commit-Liste seit letztem Tag
          changelog=$(git log $last_tag..HEAD --pretty=format:"- %s")
          echo "Changelog generated: $changelog"
          echo "::set-output name=CHANGELOG::$changelog"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.verify_version.outputs.VERSION }}
          release_name: "Release v${{ steps.verify_version.outputs.VERSION }}"
          body: |
            ### Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
