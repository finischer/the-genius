name: the-genius-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: the-genius-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: the_genius
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d the-genius"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres:
